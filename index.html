<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!--
    text-size-adjust: none would prevent iOS from scaling text — we deliberately
    do NOT set that. We want iOS Dynamic Type to flow through freely.
    The CSS below explicitly allows it on all elements.
  -->
  <title>VO Turf List</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap');
    :root{
      --bg:#0d0d0d;--surface:#1a1a1a;--border:#2e2e2e;
      --accent:#e8ff00;--accent2:#00d4ff;--danger:#ff4d4d;
      --success:#4dff91;--text:#f0f0f0;--muted:#888;
      --font-mono:'IBM Plex Mono',monospace;--font-sans:'IBM Plex Sans',sans-serif;
      --radius:4px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /*
      Root font size: inherit from the browser/OS.
      Do NOT set a px value here — that would override iOS Dynamic Type.
      All sizes below are in rem so they scale with whatever the user
      has chosen in iOS Settings > Accessibility > Display & Text Size.
    */
    html{font-size:100%;-webkit-text-size-adjust:auto;text-size-adjust:auto}
    body{
      background:var(--bg);color:var(--text);
      font-family:var(--font-sans);
      font-size:1rem;          /* inherits from html, which inherits from OS */
      line-height:1.6;min-height:100vh;padding:.75rem .75rem 3rem;
    }

    .view{display:none}
    .view.active{display:block}

    h1{font-family:var(--font-mono);font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:.6rem;border-bottom:2px solid var(--accent);padding-bottom:.5rem}

    /* ── Start section ── */
    #start-section p{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);margin-bottom:.75rem}
    #btn-start{display:block;width:100%;font-family:var(--font-mono);font-size:1rem;font-weight:700;border:3px solid var(--accent);border-radius:var(--radius);padding:.75rem;cursor:pointer;background:var(--accent);color:#000;margin-bottom:.75rem}
    #btn-start:focus-visible{outline:3px solid var(--accent2);outline-offset:4px}

    /* ── Sticky toolbar: refresh + filter side by side ── */
    #toolbar{
      position:sticky;
      top:0;
      z-index:10;
      background:var(--bg);
      display:flex;
      gap:.5rem;
      padding:.4rem 0;
      margin-bottom:.6rem;
      /* Subtle border so the toolbar is distinct from the list when scrolled */
      border-bottom:1px solid var(--border);
    }
    #btn-refresh{
      flex:1;display:flex;align-items:center;justify-content:space-between;
      gap:.5rem;font-family:var(--font-mono);font-size:.85rem;font-weight:600;
      border:2px solid var(--accent);border-radius:var(--radius);
      padding:.45rem .85rem;cursor:pointer;background:transparent;color:var(--accent);
      transition:background .15s,color .15s;white-space:nowrap;
    }
    #btn-refresh:hover{background:var(--accent);color:#000}
    #btn-refresh:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    #btn-refresh:disabled{opacity:.4;cursor:not-allowed}
    #btn-refresh:disabled:hover{background:transparent;color:var(--accent)}
    .btn-countdown-vis{font-size:.72rem;opacity:.75;white-space:nowrap}

    /* ── Filter button + popup ── */
    #filter-wrap{position:relative}
    #btn-filter{
      font-family:var(--font-mono);font-size:.85rem;font-weight:600;
      border:2px solid var(--border);border-radius:var(--radius);
      padding:.45rem .85rem;cursor:pointer;background:transparent;color:var(--muted);
      white-space:nowrap;transition:border-color .15s,color .15s;
    }
    #btn-filter[aria-expanded="true"]{border-color:var(--accent2);color:var(--accent2)}
    #btn-filter:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

    #filter-menu{
      position:absolute;
      top:calc(100% + .35rem);
      right:0;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      list-style:none;
      min-width:11rem;
      z-index:20;
      overflow:hidden;
    }
    #filter-menu[hidden]{display:none}
    #filter-menu li button{
      display:block;width:100%;text-align:left;
      font-family:var(--font-mono);font-size:.85rem;
      padding:.55rem .85rem;border:none;background:transparent;
      color:var(--text);cursor:pointer;
    }
    #filter-menu li button:hover{background:rgba(255,255,255,.06)}
    #filter-menu li button[aria-checked="true"]{color:var(--accent)}
    #filter-menu li button:focus-visible{outline:3px solid var(--accent);outline-offset:-2px}
    #filter-menu li+li{border-top:1px solid var(--border)}

    /* ── Status ── */
    #status-msg{font-size:.85rem;color:var(--muted);font-family:var(--font-mono);min-height:1.4em;margin-bottom:.6rem}
    #status-msg.error{color:var(--danger)}#status-msg.success{color:var(--success)}#status-msg.loading{color:var(--accent2)}

    /* ── Zone list ── */
    #zone-list{list-style:none;display:flex;flex-direction:column;gap:.35rem;margin-bottom:.75rem}
    .zone-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .zone-btn{display:block;width:100%;background:transparent;border:none;border-radius:var(--radius);padding:.9rem 1rem .85rem;cursor:pointer;text-align:left;color:var(--text)}
    .zone-btn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
    .zone-btn:hover{background:rgba(255,255,255,.03)}
    .zv-name{font-family:var(--font-mono);font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.45rem}
    .zv-rank{font-size:.7rem;color:var(--muted);margin-right:.3rem}
    .zv-arrow{float:right;font-size:.8rem;color:var(--muted);margin-top:.1rem}
    .zv-strip{display:flex;flex-wrap:wrap;column-gap:1.4rem;row-gap:.25rem}
    .zv-field{display:flex;flex-direction:column}
    .zv-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--font-mono)}
    .zv-value{font-family:var(--font-mono);font-size:.88rem;font-weight:600}
    .zv-value.dist{color:var(--accent2)}.zv-value.owner{color:var(--accent2)}
    .zv-value.unowned{color:var(--muted)}.zv-value.blocked{color:var(--danger)}
    .zv-value.free{color:var(--success)}.zv-value.pending{color:var(--muted)}

    #btn-load-more{display:block;width:100%;font-family:var(--font-mono);font-size:.875rem;font-weight:600;border:2px solid var(--border);border-radius:var(--radius);padding:.6rem 1rem;cursor:pointer;background:transparent;color:var(--muted);margin-bottom:.75rem;transition:border-color .15s,color .15s}
    #btn-load-more:hover{border-color:var(--accent2);color:var(--accent2)}
    #btn-load-more:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    #btn-load-more[hidden]{display:none}
    #empty-state{color:var(--muted);font-family:var(--font-mono);font-size:.9rem;padding:2rem 0}

    /* ── Lang bar ── */
    #lang-bar{display:flex;gap:.4rem;padding:.3rem 0;margin-top:.5rem;align-items:center;flex-wrap:wrap}
    .lang-btn{font-family:var(--font-mono);font-size:.8rem;font-weight:700;border:2px solid var(--border);border-radius:var(--radius);padding:.15rem .6rem;cursor:pointer;background:transparent;color:var(--muted);transition:border-color .15s,color .15s}
    .lang-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
    .lang-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .update-line{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-left:.25rem}

    /* ── Detail list ── */
    #detail-list li{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:.6rem .85rem;
      font-family:var(--font-mono);font-size:.88rem;color:var(--text);line-height:1.5;
    }
  </style>
</head>
<body>

  <!-- ══ LIST VIEW ══ -->
  <div id="list-view" class="view active">
    <h1>VO Turf List</h1>

    <div id="start-section">
      <p id="start-subtitle">Navigation från din aktuella position.</p>
      <button id="btn-start" aria-label="Starta navigering och ladda zoner i närheten">Starta navigering</button>
    </div>

    <!-- Sticky two-button toolbar -->
    <div id="toolbar">
      <button id="btn-refresh" aria-label="Uppdatera zoner. Automatisk uppdatering om — sekunder." disabled>
        <span id="btn-refresh-label" aria-hidden="true">Uppdatera nu</span>
        <span class="btn-countdown-vis" aria-hidden="true"><span id="countdown">—</span>s</span>
      </button>

      <div id="filter-wrap">
        <button id="btn-filter" aria-expanded="false" aria-haspopup="listbox">
          <span id="btn-filter-label">Alla zoner</span>
        </button>
        <ul id="filter-menu" role="listbox" hidden>
          <li><button role="option" data-filter="all"       aria-checked="true">Alla zoner</button></li>
          <li><button role="option" data-filter="available" aria-checked="false">Tillgängliga</button></li>
          <li><button role="option" data-filter="blocked"   aria-checked="false">Blockerade</button></li>
        </ul>
      </div>
    </div>

    <div id="status-msg" aria-live="polite" aria-atomic="true">Hämtar navigationsposition…</div>

    <ul id="zone-list" aria-label="Navigation från din aktuella position"></ul>
    <div id="empty-state" hidden>Inga zoner hittades i närheten.</div>
    <button id="btn-load-more" hidden>Ladda fler zoner</button>

    <div id="lang-bar" aria-label="Language / Språk">
      <button class="lang-btn" id="btn-lang-sv" aria-pressed="true" aria-label="Byt till svenska">SV</button>
      <button class="lang-btn" id="btn-lang-en" aria-pressed="false" aria-label="Switch to English">EN</button>
      <span class="update-line">Made by Conejo, last updated 2026-05-19 19:30</span>
    </div>
  </div>

  <!-- ══ DETAIL VIEW ══ -->
  <div id="detail-view" class="view">
    <h1 id="detail-heading" tabindex="-1">—</h1>
    <ul id="detail-list" style="list-style:none;display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem">
      <li id="di-block">—</li>
      <li id="di-location">—</li>
      <li id="di-owner">—</li>
      <li id="di-taken">—</li>
      <li id="di-points">—</li>
      <li id="di-zone">—</li>
      <li id="di-created">—</li>
    </ul>
    <div id="owned-section" hidden>
      <h2 id="owned-heading" style="font-family:var(--font-mono);font-size:1.2rem;font-weight:700;color:var(--accent);margin:1.25rem 0 .6rem;border-bottom:1px solid var(--border);padding-bottom:.4rem">—</h2>
      <ul id="owned-list" style="list-style:none;display:flex;flex-direction:column;gap:.35rem"></ul>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════
     TRANSLATIONS
  ════════════════════════════════════════ */
  const T={
    sv:{
      htmlLang:'sv',
      startSubtitle:'Navigation från din aktuella position.',
      startBtn:'Starta navigering',startBtnAria:'Starta navigering och ladda zoner i närheten',
      refreshLabel:'Uppdatera nu',
      refreshAria:(s)=>`Uppdatera zoner. Automatisk uppdatering om ${s} sekunder.`,
      statusAcquiring:'Hämtar navigationsposition…',
      statusLoading:'Laddar zoner i närheten…',
      statusUpdated:(time,shown,total)=>`Uppdaterad ${time}. Visar ${shown} av ${total} zoner.`,
      statusError:(m)=>`Fel: ${m}`,
      listAriaLabel:'Navigation från din aktuella position',
      emptyState:'Inga zoner hittades i närheten.',
      emptyFiltered:'Inga zoner matchar det valda filtret.',
      loadMore:(n)=>`Ladda ${n} fler zoner`,loadMoreAria:(n,r)=>`Ladda ${n} fler zoner. ${r} återstår.`,
      geoErr1:'Navigering nekad. Tillåt plats i Safari-inställningar.',
      geoErr2:'Position ej tillgänglig. Kontrollera platsinställningar.',
      geoErr3:'Navigering tog för lång tid. Försöker igen…',
      geoErrUnknown:'Navigeringsfel.',geoNotSupported:'Navigering stöds inte av denna webbläsare.',
      unowned:'Ej ägd',ownedBy:(n)=>`Ägs av ${n}.`,
      available:'Tillgänglig',neverTaken:'Aldrig tagen — tillgänglig',
      blocked:(d)=>`Blockerad — ${d} kvar`,
      blockedBy:(name,d)=>`Blockerad av ${name} — ${d} kvar.`,
      checkingBlock:'Kontrollerar blocktid…',
      takenAgo:(d)=>`Tagen ${d} sedan`,agoSuffix:'sedan',
      unknown:'Okänd',unownedLabel:'Ej ägd',na:'Ej tillgänglig',loadingDots:'Laddar…',
      ownsZones:(name,n)=>`${name} äger ${n} zoner:`,ownsZonesLoading:'Laddar ägda zoner…',
      filterAll:'Alla zoner',filterAvailable:'Tillgängliga',filterBlocked:'Blockerade',
      filterBtnAria:(f)=>`Filter: ${f}. Tryck för att ändra.`,
      dkDist:'Avstånd',dkDir:'Riktning',dkStatus:'Status',
      dkElapsed:'Tid sedan tagning',dkOwnerBt:'Ägarens blocktid',
      dkOwner:'Nuvarande ägare',dkLasttaken:'Senast tagen',
      dkTotal:'Totalt tagningar',dkTp:'Tagningspoäng',dkPph:'Poäng per timme',
      dkType:'Zontyp',dkRegion:'Region',dkCreated:'Skapad',
      pageTitle:(n)=>`${n} — VO Turf`,
      langBtnSvAria:'Byt till svenska',langBtnEnAria:'Switch to English',
      compassDenied:'Kompassåtkomst nekad.',
      clock:[[15,"Klockan 12, norr"],[45,"Klockan 1, nord-nordost"],[75,"Klockan 2, nordost"],
        [105,"Klockan 3, öst"],[135,"Klockan 4, sydost"],[165,"Klockan 5, syd-sydost"],
        [195,"Klockan 6, söder"],[225,"Klockan 7, syd-sydväst"],[255,"Klockan 8, sydväst"],
        [285,"Klockan 9, väst"],[315,"Klockan 10, nordväst"],[345,"Klockan 11, nord-nordväst"],
        [360,"Klockan 12, norr"]],
    },
    en:{
      htmlLang:'en',
      startSubtitle:'Navigation from your current position.',
      startBtn:'Start navigation',startBtnAria:'Start navigation and load nearby zones',
      refreshLabel:'Refresh now',
      refreshAria:(s)=>`Refresh zones. Auto-refresh in ${s} seconds.`,
      statusAcquiring:'Acquiring navigation position…',
      statusLoading:'Loading nearby zones…',
      statusUpdated:(time,shown,total)=>`Updated ${time}. Showing ${shown} of ${total} zones.`,
      statusError:(m)=>`Error: ${m}`,
      listAriaLabel:'Navigation from your current position',
      emptyState:'No zones found near your location.',
      emptyFiltered:'No zones match the current filter.',
      loadMore:(n)=>`Load ${n} more zones`,loadMoreAria:(n,r)=>`Load ${n} more zones. ${r} remaining.`,
      geoErr1:'Navigation access denied. Please allow location in Safari settings.',
      geoErr2:'Position unavailable. Check your device location settings.',
      geoErr3:'Navigation timed out. Retrying…',
      geoErrUnknown:'Navigation error.',geoNotSupported:'Navigation not supported by this browser.',
      unowned:'Unowned',ownedBy:(n)=>`Owned by ${n}.`,
      available:'Available',neverTaken:'Never taken — available',
      blocked:(d)=>`Blocked — ${d} remaining`,
      blockedBy:(name,d)=>`Blocked by ${name} — ${d} remaining.`,
      checkingBlock:'Checking block time…',
      takenAgo:(d)=>`Taken ${d} ago`,agoSuffix:'ago',
      unknown:'Unknown',unownedLabel:'Unowned',na:'N/A',loadingDots:'Loading…',
      ownsZones:(name,n)=>`${name} owns ${n} zones:`,ownsZonesLoading:'Loading owned zones…',
      filterAll:'All zones',filterAvailable:'Available',filterBlocked:'Blocked',
      filterBtnAria:(f)=>`Filter: ${f}. Tap to change.`,
      dkDist:'Distance',dkDir:'Direction',dkStatus:'Status',
      dkElapsed:'Time since taken',dkOwnerBt:"Owner's block time",
      dkOwner:'Current owner',dkLasttaken:'Last taken',
      dkTotal:'Total takeovers',dkTp:'Takeover points',dkPph:'Points per hour',
      dkType:'Zone type',dkRegion:'Region',dkCreated:'Date created',
      pageTitle:(n)=>`${n} — VO Turf`,
      langBtnSvAria:'Byt till svenska',langBtnEnAria:'Switch to English',
      compassDenied:'Compass access denied.',
      clock:[[15,"12 o'clock, north"],[45,"1 o'clock, north-north-east"],[75,"2 o'clock, north-east"],
        [105,"3 o'clock, east"],[135,"4 o'clock, south-east"],[165,"5 o'clock, south-south-east"],
        [195,"6 o'clock, south"],[225,"7 o'clock, south-south-west"],[255,"8 o'clock, south-west"],
        [285,"9 o'clock, west"],[315,"10 o'clock, north-west"],[345,"11 o'clock, north-north-west"],
        [360,"12 o'clock, north"]],
    }
  };

  /* ════════════════════════════════════════
     CONFIG & STATE
  ════════════════════════════════════════ */
  const API_BASE='https://api.turfgame.com/v5';
  const PAGE_SIZE=10,INITIAL_MAX=30,REFRESH_SEC=30,BBOX_DEG=0.045,GEO_TIMEOUT=10000;

  let lang='sv',t=T.sv;
  let userLat=null,userLon=null;
  let compassHeading=null;        // degrees from north, updated by device compass
  let compassAvailable=false;

  let allZonesSorted=[],shownCount=INITIAL_MAX;
  let activeFilter='all';         // 'all' | 'available' | 'blocked' — persists across refreshes
  const ownerCache={};
  let countdownValue=REFRESH_SEC,countdownTimer=null,refreshTimer=null;
  let isFetching=false,blockTickInterval=null,detailLiveInterval=null;
  let activeZone=null,lastFocusedBtn=null;

  /* ════════════════════════════════════════
     DOM REFS
  ════════════════════════════════════════ */
  const listView     =document.getElementById('list-view');
  const detailView   =document.getElementById('detail-view');
  const startSection =document.getElementById('start-section');
  const statusMsg    =document.getElementById('status-msg');
  const zoneList     =document.getElementById('zone-list');
  const emptyState   =document.getElementById('empty-state');
  const btnRefresh   =document.getElementById('btn-refresh');
  const countdownVis =document.getElementById('countdown');
  const btnLoadMore  =document.getElementById('btn-load-more');
  const btnStart     =document.getElementById('btn-start');
  const btnLangSv    =document.getElementById('btn-lang-sv');
  const btnLangEn    =document.getElementById('btn-lang-en');
  const detailHeading=document.getElementById('detail-heading');
  const btnFilter    =document.getElementById('btn-filter');
  const btnFilterLabel=document.getElementById('btn-filter-label');
  const filterMenu   =document.getElementById('filter-menu');

  /* ════════════════════════════════════════
     COMPASS
     requestPermission must be called inside the
     user gesture (same click handler as GPS).
     Once granted, DeviceOrientationEvent fires
     continuously with webkitCompassHeading.
  ════════════════════════════════════════ */
  function initCompass(){
    if(typeof DeviceOrientationEvent==='undefined'){return}
    const req=DeviceOrientationEvent.requestPermission;
    if(typeof req==='function'){
      req().then(state=>{
        if(state==='granted') startCompassListener();
        /* If denied, we fall back silently to north-relative directions */
      }).catch(()=>{});
    } else {
      /* Non-iOS — no permission needed, just start listening */
      startCompassListener();
    }
  }

  function startCompassListener(){
    window.addEventListener('deviceorientation', e=>{
      /* webkitCompassHeading: 0=north, clockwise. Only available on iOS Safari. */
      if(e.webkitCompassHeading!=null){
        compassHeading=e.webkitCompassHeading;
        compassAvailable=true;
      } else if(e.alpha!=null){
        /* Android fallback: alpha is CCW from north, convert to CW */
        compassHeading=(360-e.alpha)%360;
        compassAvailable=true;
      }
    },true);
  }

  /* ════════════════════════════════════════
     HISTORY / VIEW SWITCHING
  ════════════════════════════════════════ */
  function showList(fromPopState=false){
    clearInterval(detailLiveInterval);
    activeZone=null;
    detailView.classList.remove('active');
    listView.classList.add('active');
    document.title='VO Turf List';
    if(lastFocusedBtn){lastFocusedBtn.focus();lastFocusedBtn=null;}
    if(!fromPopState) history.replaceState({view:'list'},'',location.pathname);
  }

  function showDetail(zone,fromPopState=false){
    clearInterval(detailLiveInterval);
    activeZone=zone;
    document.getElementById('owned-section').hidden=true;
    document.getElementById('owned-list').innerHTML='';
    listView.classList.remove('active');
    detailView.classList.add('active');
    document.title=t.pageTitle(zone.name);
    renderDetail();
    detailHeading.focus();
    if(!fromPopState) history.pushState({view:'detail',zoneId:zone.id},'',`#zone-${zone.id}`);
    detailLiveInterval=setInterval(renderDetailLive,1000);
    const ownerId=zone.currentOwner?.id;
    if(ownerId){
      const entry=ownerCache[ownerId];
      if(entry?.zones?.length) fetchAndRenderOwnedZones(zone.currentOwner,entry.zones);
    }
  }

  window.addEventListener('popstate',e=>{
    if(e.state?.view==='detail'){
      const z=allZonesSorted.find(z=>z.id===e.state.zoneId);
      if(z){showDetail(z,true);return;}
    }
    showList(true);
  });
  history.replaceState({view:'list'},'',location.pathname);

  /* ════════════════════════════════════════
     LANGUAGE
  ════════════════════════════════════════ */
  function switchLang(newLang){
    lang=newLang;t=T[lang];
    document.documentElement.lang=t.htmlLang;
    btnLangSv.setAttribute('aria-pressed',lang==='sv'?'true':'false');
    btnLangEn.setAttribute('aria-pressed',lang==='en'?'true':'false');
    btnLangSv.setAttribute('aria-label',t.langBtnSvAria);
    btnLangEn.setAttribute('aria-label',t.langBtnEnAria);
    document.getElementById('start-subtitle').textContent=t.startSubtitle;
    btnStart.textContent=t.startBtn;btnStart.setAttribute('aria-label',t.startBtnAria);
    document.getElementById('btn-refresh-label').textContent=t.refreshLabel;
    setRefreshLabel(countdownValue);
    zoneList.setAttribute('aria-label',t.listAriaLabel);
    /* Update filter menu option labels */
    const opts=filterMenu.querySelectorAll('button[data-filter]');
    opts[0].textContent=t.filterAll;
    opts[1].textContent=t.filterAvailable;
    opts[2].textContent=t.filterBlocked;
    updateFilterLabel();
    try{localStorage.setItem('turf-lang',lang)}catch(e){}
    refreshAllBlockLabels();
    if(activeZone) renderDetail();
  }
  btnLangSv.addEventListener('click',()=>switchLang('sv'));
  btnLangEn.addEventListener('click',()=>switchLang('en'));

  /* ════════════════════════════════════════
     FILTER
  ════════════════════════════════════════ */
  function filterLabel(){
    return activeFilter==='available'?t.filterAvailable:activeFilter==='blocked'?t.filterBlocked:t.filterAll;
  }

  function updateFilterLabel(){
    btnFilterLabel.textContent=filterLabel();
    btnFilter.setAttribute('aria-label',t.filterBtnAria(filterLabel()));
    /* Update aria-checked on options */
    filterMenu.querySelectorAll('button[data-filter]').forEach(b=>{
      b.setAttribute('aria-checked', b.dataset.filter===activeFilter?'true':'false');
    });
  }

  /* Toggle filter menu open/closed */
  btnFilter.addEventListener('click',()=>{
    const open=filterMenu.hidden===false;
    filterMenu.hidden=open;
    btnFilter.setAttribute('aria-expanded',String(!open));
    if(!open) filterMenu.querySelector(`button[data-filter="${activeFilter}"]`)?.focus();
  });

  /* Close menu on outside click */
  document.addEventListener('click',e=>{
    if(!e.target.closest('#filter-wrap')){
      filterMenu.hidden=true;
      btnFilter.setAttribute('aria-expanded','false');
    }
  });

  /* Handle option selection */
  filterMenu.querySelectorAll('button[data-filter]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeFilter=btn.dataset.filter;
      filterMenu.hidden=true;
      btnFilter.setAttribute('aria-expanded','false');
      btnFilter.focus();
      updateFilterLabel();
      renderZoneSlice();   /* re-render with new filter, no API call */
    });
  });

  /* Apply filter to the full sorted list */
  function getFilteredZones(){
    if(activeFilter==='available'){
      return allZonesSorted.filter(z=>{
        const b=getBlockStatus(z);
        return b.blocked===false;
      });
    }
    if(activeFilter==='blocked'){
      return allZonesSorted.filter(z=>{
        const b=getBlockStatus(z);
        return b.blocked===true||b.blocked===null;
      });
    }
    return allZonesSorted;
  }

  /* ════════════════════════════════════════
     HELPERS
  ════════════════════════════════════════ */
  function setStatus(msg,type=''){statusMsg.textContent=msg;statusMsg.className=type}
  function setRefreshLabel(sec){btnRefresh.setAttribute('aria-label',t.refreshAria(sec===null?'—':sec))}

  function haversineKm(lat1,lon1,lat2,lon2){
    const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }
  function distStr(km){const m=Math.round(km*1000);return m<1000?`${m} m`:`${(m/1000).toFixed(2)} km`}

  function bearingDeg(lat1,lon1,lat2,lon2){
    const φ1=lat1*Math.PI/180,φ2=lat2*Math.PI/180,Δλ=(lon2-lon1)*Math.PI/180;
    const y=Math.sin(Δλ)*Math.cos(φ2),x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    return(Math.atan2(y,x)*180/Math.PI+360)%360;
  }

  /* Relative bearing: subtract compass heading so direction is relative to where you face */
  function relativeBearing(absBearing){
    if(!compassAvailable||compassHeading===null) return absBearing;
    return(absBearing-compassHeading+360)%360;
  }

  function clockDir(deg){return t.clock.find(d=>deg<d[0])?.[1]??t.clock[0][1]}

  function directionToZone(zoneLat,zoneLon){
    const abs=bearingDeg(userLat,userLon,zoneLat,zoneLon);
    return clockDir(relativeBearing(abs));
  }

  function elapsedSec(iso){if(!iso)return null;return Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/1000))}
  function formatDuration(sec){
    if(sec===null||sec===undefined)return'?';
    if(sec>=3600)return`${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m`;
    if(sec>=60)return`${Math.floor(sec/60)}m ${(sec%60).toString().padStart(2,'0')}s`;
    return`${sec}s`;
  }
  function formatDate(iso){
    if(!iso)return t.unknown;
    return new Date(iso).toLocaleString(lang==='sv'?'sv-SE':'en-GB',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function escHtml(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
  function escAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}

  /* ════════════════════════════════════════
     BLOCK STATUS
  ════════════════════════════════════════ */
  function getBlockStatus(zone){
    if(!zone.dateLastTaken)return{blocked:false,label:t.neverTaken,css:'free'};
    const elapsed=elapsedSec(zone.dateLastTaken);
    const ownerId=zone.currentOwner?.id;
    if(!ownerId)return{blocked:false,label:t.available,css:'free'};
    const entry=ownerCache[ownerId];
    if(entry===undefined)return{blocked:null,label:t.checkingBlock,css:'pending'};
    if(entry===null)return{blocked:null,label:t.takenAgo(formatDuration(elapsed)),css:'pending'};
    const remaining=entry.blocktime-elapsed;
    if(remaining<=0)return{blocked:false,label:t.available,css:'free'};
    return{blocked:true,label:t.blocked(formatDuration(remaining)),css:'blocked'};
  }

  /* ════════════════════════════════════════
     FETCH OWNER BLOCKTIMES
  ════════════════════════════════════════ */
  async function fetchOwnerBlocktimes(zones){
    const needed=zones.filter(z=>z.currentOwner?.id&&ownerCache[z.currentOwner.id]===undefined);
    if(!needed.length)return;
    const unique=[...new Map(needed.map(z=>[z.currentOwner.id,{id:z.currentOwner.id}])).values()];
    unique.forEach(({id})=>{ownerCache[id]=undefined});
    try{
      const r=await fetch(`${API_BASE}/users`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(unique)});
      if(!r.ok)throw new Error();
      const users=await r.json();
      users.forEach(u=>{ownerCache[u.id]={blocktime:u.blocktime,rank:u.rank,zones:u.zones||[]}});
      unique.forEach(({id})=>{if(ownerCache[id]===undefined)ownerCache[id]=null});
    }catch{unique.forEach(({id})=>{ownerCache[id]=null})}
    refreshAllBlockLabels();
    if(activeZone) renderDetailLive();
    if(activeZone?.currentOwner?.id){
      const entry=ownerCache[activeZone.currentOwner.id];
      if(entry?.zones?.length) fetchAndRenderOwnedZones(activeZone.currentOwner,entry.zones);
    }
  }

  /* ════════════════════════════════════════
     BUILD ZONE ITEM
  ════════════════════════════════════════ */
  function buildZoneItem(zone,rank,skipOwner=false){
    const ds=distStr(zone._dist??0);
    const clock=directionToZone(zone.latitude,zone.longitude);
    const owner=zone.currentOwner?.name??null;
    const isUnowned=!owner;
    const ownerDisplay=isUnowned?t.unowned:owner;
    const ownerClass=isUnowned?'unowned':'owner';
    const block=getBlockStatus(zone);

    function buildLabel(b){
      if(skipOwner){
        return`${zone.name}. ${ds} bort. ${clock}. ${b.label}.`;
      }
      if(b.blocked===true&&owner){
        const dur=b.label.replace(/^Blocked — |^Blockerad — /,'').replace(/ remaining\.?$| kvar\.?$/,'');
        return`${zone.name}. ${ds} bort. ${clock}. ${t.blockedBy(owner,dur)}`;
      }
      const ownerPart=isUnowned?`${t.unowned}.`:t.ownedBy(owner);
      return`${zone.name}. ${ds} bort. ${clock}. ${ownerPart} ${b.label}.`;
    }

    const ownerField=skipOwner?'':
      `<div class="zv-field"><span class="zv-label">${t.dkOwner}</span><span class="zv-value ${ownerClass}">${escHtml(ownerDisplay)}</span></div>`;

    const li=document.createElement('li');
    li.className='zone-card';
    li.innerHTML=`
      <button class="zone-btn" aria-label="${escAttr(buildLabel(block))}">
        <div aria-hidden="true">
          <div class="zv-name"><span class="zv-rank">#${rank}</span>${escHtml(zone.name)}<span class="zv-arrow">&#8594;</span></div>
          <div class="zv-strip">
            <div class="zv-field"><span class="zv-label">${t.dkDist}</span><span class="zv-value dist">${ds}</span></div>
            <div class="zv-field"><span class="zv-label">${t.dkDir}</span><span class="zv-value">${clock.split(',')[0]}</span></div>
            ${ownerField}
            <div class="zv-field"><span class="zv-label">${t.dkStatus}</span><span class="zv-value ${block.css} js-block-val">${escHtml(block.label)}</span></div>
          </div>
        </div>
      </button>`;

    const btn=li.querySelector('.zone-btn');
    btn.addEventListener('click',()=>{lastFocusedBtn=btn;showDetail(zone)});
    li._zone=zone;li._buildLabel=buildLabel;
    return li;
  }

  /* ════════════════════════════════════════
     RENDER LIST
  ════════════════════════════════════════ */
  function renderZoneSlice(){
    zoneList.innerHTML='';emptyState.hidden=true;

    const filtered=getFilteredZones();
    const visible=filtered.slice(0,shownCount);

    if(!filtered.length){
      emptyState.textContent=allZonesSorted.length?t.emptyFiltered:t.emptyState;
      emptyState.hidden=false;btnLoadMore.hidden=true;return;
    }

    const frag=document.createDocumentFragment();
    visible.forEach((z,i)=>frag.appendChild(buildZoneItem(z,i+1)));
    zoneList.appendChild(frag);

    /* Load more based on filtered count */
    btnLoadMore.hidden=shownCount>=filtered.length;
    if(!btnLoadMore.hidden){
      const r=filtered.length-shownCount,n=Math.min(PAGE_SIZE,r);
      btnLoadMore.textContent=t.loadMore(n);
      btnLoadMore.setAttribute('aria-label',t.loadMoreAria(n,r));
    }

    fetchOwnerBlocktimes(visible);
    startBlockTicker();
  }

  function loadMore(){
    const filtered=getFilteredZones();
    const prev=shownCount;
    shownCount=Math.min(shownCount+PAGE_SIZE,filtered.length);
    if(shownCount===prev)return;
    const slice=filtered.slice(prev,shownCount);
    const frag=document.createDocumentFragment();
    slice.forEach((z,i)=>frag.appendChild(buildZoneItem(z,prev+i+1)));
    zoneList.appendChild(frag);
    btnLoadMore.hidden=shownCount>=filtered.length;
    if(!btnLoadMore.hidden){
      const r=filtered.length-shownCount,n=Math.min(PAGE_SIZE,r);
      btnLoadMore.textContent=t.loadMore(n);
      btnLoadMore.setAttribute('aria-label',t.loadMoreAria(n,r));
    }
    fetchOwnerBlocktimes(slice);
    zoneList.querySelectorAll('.zone-card')[prev]?.querySelector('.zone-btn')?.focus();
  }
  btnLoadMore.addEventListener('click',loadMore);

  function startBlockTicker(){
    clearInterval(blockTickInterval);
    blockTickInterval=setInterval(refreshAllBlockLabels,1000);
  }

  function refreshAllBlockLabels(){
    zoneList.querySelectorAll('.zone-card').forEach(card=>{
      if(!card._zone)return;
      const block=getBlockStatus(card._zone);
      const span=card.querySelector('.js-block-val');
      const btn=card.querySelector('.zone-btn');
      if(span){span.textContent=block.label;span.className=`zv-value ${block.css} js-block-val`}
      if(btn&&card._buildLabel) btn.setAttribute('aria-label',escAttr(card._buildLabel(block)));
    });
  }

  /* ════════════════════════════════════════
     DETAIL RENDER
  ════════════════════════════════════════ */
  function di(id){return document.getElementById(id)}

  function renderDetail(){
    const z=activeZone;if(!z)return;
    const km=haversineKm(userLat,userLon,z.latitude,z.longitude);
    const clock=directionToZone(z.latitude,z.longitude);
    detailHeading.textContent=z.name;
    di('di-location').textContent=`${distStr(km)} — ${clock}`;
    di('di-points').textContent=`${t.dkTp} ${z.takeoverPoints??z.takeoverpoints??'?'}, ${t.dkPph} ${z.pointsPerHour??0}`;
    di('di-zone').textContent=`${t.dkType} ${z.type?.name??t.unknown}, ${t.dkRegion} ${z.region?.name??t.unknown}`;
    di('di-created').textContent=`${t.dkCreated} ${formatDate(z.dateCreated)}, ${t.dkTotal} ${(z.totalTakeovers??0).toLocaleString()}`;
    renderDetailLive();
  }

  function renderDetailLive(){
    const z=activeZone;if(!z)return;
    const block=getBlockStatus(z);
    const elapsed=elapsedSec(z.dateLastTaken);
    const ownerId=z.currentOwner?.id;
    const entry=ownerId?ownerCache[ownerId]:null;
    const ownerName=z.currentOwner?.name??t.unownedLabel;
    const rankStr=entry?.rank!=null?` rank ${entry.rank}`:'';
    const btStr=entry?.blocktime!=null?`, ${t.dkOwnerBt} ${formatDuration(entry.blocktime)}`:'';
    di('di-block').textContent=block.label;
    di('di-owner').textContent=`${t.dkOwner} ${ownerName}${rankStr}${btStr}`;
    const lastTaken=formatDate(z.dateLastTaken);
    const elapsedStr=elapsed!==null?`${formatDuration(elapsed)} ${t.agoSuffix}`:t.unknown;
    di('di-taken').textContent=`${t.dkLasttaken} ${lastTaken}, ${t.dkElapsed} ${elapsedStr}`;
  }

  /* ════════════════════════════════════════
     OWNED ZONES
  ════════════════════════════════════════ */
  async function fetchAndRenderOwnedZones(owner,zoneIds){
    const sec=document.getElementById('owned-section');
    const hd=document.getElementById('owned-heading');
    const ul=document.getElementById('owned-list');
    hd.textContent=t.ownsZonesLoading;sec.hidden=false;ul.innerHTML='';
    try{
      const r=await fetch(`${API_BASE}/zones`,{method:'POST',headers:{'Content-Type':'application/json','Accept-Encoding':'gzip'},body:JSON.stringify(zoneIds.map(id=>({id})))});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const zones=await r.json();
      if(userLat!==null){
        zones.forEach(z=>{z._dist=haversineKm(userLat,userLon,z.latitude,z.longitude)});
        zones.sort((a,b)=>a._dist-b._dist);
      } else {zones.sort((a,b)=>a.name.localeCompare(b.name))}
      hd.textContent=t.ownsZones(owner.name,zones.length);
      if(!zones.length){ul.innerHTML=`<li style="color:var(--muted);font-family:var(--font-mono);font-size:.85rem">—</li>`;return}
      const frag=document.createDocumentFragment();
      zones.forEach((z,i)=>frag.appendChild(buildZoneItem(z,i+1,true)));
      ul.appendChild(frag);
    }catch(e){
      hd.textContent=owner.name;
      ul.innerHTML=`<li style="color:var(--danger);font-family:var(--font-mono);font-size:.85rem">Kunde inte ladda zoner</li>`;
    }
  }

  /* ════════════════════════════════════════
     FETCH ZONES
  ════════════════════════════════════════ */
  async function fetchNearbyZones(){
    if(isFetching||userLat===null)return;
    isFetching=true;btnRefresh.disabled=true;
    setStatus(t.statusLoading,'loading');
    const half=BBOX_DEG/2;
    const body=JSON.stringify([{northEast:{latitude:userLat+half,longitude:userLon+half},southWest:{latitude:userLat-half,longitude:userLon-half}}]);
    try{
      const r=await fetch(`${API_BASE}/zones`,{method:'POST',headers:{'Content-Type':'application/json','Accept-Encoding':'gzip'},body});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.errorMessage||`HTTP ${r.status}`)}
      const zones=await r.json();
      zones.forEach(z=>{z._dist=haversineKm(userLat,userLon,z.latitude,z.longitude)});
      zones.sort((a,b)=>a._dist-b._dist);
      allZonesSorted=zones;
      /* Reset shownCount but keep active filter */
      shownCount=Math.min(INITIAL_MAX,getFilteredZones().length||INITIAL_MAX);
      renderZoneSlice();
      setStatus(t.statusUpdated(new Date().toLocaleTimeString(),Math.min(shownCount,getFilteredZones().length),allZonesSorted.length),'success');
    }catch(e){setStatus(t.statusError(e.message),'error')}
    finally{isFetching=false;btnRefresh.disabled=false;startCountdown()}
  }

  /* ════════════════════════════════════════
     COUNTDOWN
  ════════════════════════════════════════ */
  function startCountdown(){
    clearInterval(countdownTimer);clearTimeout(refreshTimer);
    countdownValue=REFRESH_SEC;countdownVis.textContent=countdownValue;setRefreshLabel(countdownValue);
    countdownTimer=setInterval(()=>{
      countdownValue--;countdownVis.textContent=countdownValue;setRefreshLabel(countdownValue);
      if(countdownValue<=0)clearInterval(countdownTimer);
    },1000);
    refreshTimer=setTimeout(fetchNearbyZones,REFRESH_SEC*1000);
  }

  /* ════════════════════════════════════════
     GEOLOCATION
  ════════════════════════════════════════ */
  function initGeo(){
    if(!navigator.geolocation){setStatus(t.geoNotSupported,'error');return}
    setStatus(t.statusAcquiring,'loading');
    navigator.geolocation.watchPosition(
      pos=>{const first=userLat===null;userLat=pos.coords.latitude;userLon=pos.coords.longitude;
        if(first){btnRefresh.disabled=false;fetchNearbyZones()}},
      err=>{const msgs={1:t.geoErr1,2:t.geoErr2,3:t.geoErr3};setStatus(msgs[err.code]||t.geoErrUnknown,'error')},
      {enableHighAccuracy:true,timeout:GEO_TIMEOUT,maximumAge:5000}
    );
  }

  /* ════════════════════════════════════════
     INIT
  ════════════════════════════════════════ */
  btnStart.addEventListener('click',()=>{
    startSection.hidden=true;
    /* Both permissions triggered by the same user tap */
    initCompass();
    initGeo();
  });

  btnRefresh.addEventListener('click',()=>{
    clearInterval(countdownTimer);clearTimeout(refreshTimer);fetchNearbyZones();
  });

  updateFilterLabel();
  try{const saved=localStorage.getItem('turf-lang');switchLang((saved&&T[saved])?saved:'sv')}
  catch(e){switchLang('sv')}
  </script>
</body>
